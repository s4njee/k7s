# Packaged-app e2e (B83): the golden path driven through tauri-driver/WebDriver
# against the kind fixture. Runs nightly (and on demand) because WebKit under
# xvfb flakes; each run uploads e2e-results.json — the per-step ledger used to
# judge the seven-day flake rate.
#
# Flake gate: once the nightly suite shows <5% flake over 7 days, promote this
# job (as-is) into release.yml as a required PR/main check and remove the
# schedule. Until then it stays nightly — informational, never gating.
#
# The app under test is the *release* binary built with dev/tauri.e2e.conf.json
# (window devtools enabled — required for the WebDriver session; the config is
# never shipped). The outage step stops/starts the kind control-plane container
# and can be skipped on manual runs via the workflow_dispatch input.

name: e2e-nightly

on:
  schedule:
    # 05:23 UTC — off-peak, off the :00/:30 marks.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      skip_outage:
        description: "Skip the simulated-outage step (flakiest; handy for a quick manual check)"
        type: boolean
        default: false

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.1-0 \
            webkit2gtk-driver \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl wget file \
            xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-driver is binary-only (no lib target), so it can't be a Cargo
      # dependency — install the standalone server. The e2e is a Linux path.
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6

      - name: Build the frontend
        run: pnpm run build

      # The release binary the bundles wrap, built with the e2e-only devtools
      # config (complete file, not an overlay — arrays replace on merge). The
      # binary embeds ../dist, so the frontend build above must run first.
      - name: Build the app (e2e config)
        run: |
          TAURI_CONFIG="$(cat ../dev/tauri.e2e.conf.json)" cargo build --release
        working-directory: src-tauri

      - name: Install kind, kubectl, and helm
        run: |
          curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind
          curl -Lo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      - uses: azure/setup-helm@v4

      - name: Provision the fixture cluster
        run: |
          ./dev/cluster/up.sh --metrics
          ./dev/cluster/helm-fixture.sh
          kubectl config set-context k7s-dev-alt --cluster kind-k7s-dev --user kind-k7s-dev

      - name: Run the golden path under xvfb
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          E2E_ARGS=()
          if [[ "${{ github.event.inputs.skip_outage }}" == "true" ]]; then
            E2E_ARGS+=(--skip-outage)
          fi
          xvfb-run -a node dev/e2e.mjs "${E2E_ARGS[@]}"

      - name: Upload the e2e results ledger and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            e2e/
          if-no-files-found: ignore

      - name: Tear down the kind cluster
        if: always()
        run: ./dev/cluster/down.sh
