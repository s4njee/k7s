# Services (ClusterIP + LoadBalancer + headless) and an Ingress.

apiVersion: v1
kind: Service
metadata:
  name: valkyrie-api
  namespace: prod
spec:
  type: ClusterIP
  selector: { app: valkyrie-api }
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost-gateway
  namespace: prod
spec:
  type: LoadBalancer
  selector: { app: bifrost-gateway }
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
---
# Headless service (clusterIP: None) for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: yggdrasil-db
  namespace: prod
spec:
  clusterIP: None
  selector: { app: yggdrasil-db }
  ports:
    - port: 5432
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP
  selector: { app: grafana }
  ports:
    - port: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-public
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
    - host: api.freya.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: valkyrie-api
                port:
                  number: 8080
---
# A NetworkPolicy that selects bifrost-gateway and lets it egress to
# valkyrie-api. kind's default CNI (kindnet) doesn't enforce NetworkPolicies, so
# this is inert at the data plane — it exists so the table and the pod panel's
# "which NetworkPolicies select this pod" join have real objects to show.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bifrost-egress
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: bifrost-gateway
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: valkyrie-api
      ports:
        - protocol: TCP
          port: 8080
