# ResourceQuota and LimitRange for the prod namespace (B80) — the "quota fill"
# the Namespace properties panel shows. Hard values sit comfortably above the
# fixtures' actual requests so nothing in the cluster is blocked by them.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    count/pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: prod-limits
  namespace: prod
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: "4"
        memory: 8Gi
