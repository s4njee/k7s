[package]
name = "k7s"
version = "0.6.0"
description = "k7s — a Lens-style Kubernetes visual monitor"
license = "MIT"
authors = ["k7s"]
edition = "2021"
# 1.77.2 is what our dependency set actually needs (tauri-plugin-window-state
# 2.x declares it). Leaving this at 1.77 silently resolved that plugin to a
# v0.1.1 built for Tauri v1 — cargo downgrades rather than complains.
rust-version = "1.77.2"

# The library crate holds all app logic (commands, kube plumbing) so it can be
# unit-tested with `cargo test`; main.rs is a thin binary that calls into it.
[lib]
name = "k7s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri shell ---
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Native file-open dialog for the "Import kubeconfig" action.
tauri-plugin-dialog = "2"
# Remembers window size/position/monitor across launches (B22).
tauri-plugin-window-state = "2"
# Writes to the system clipboard from Rust (B37): Secret values are copied by a
# backend command so the plaintext never enters the webview.
tauri-plugin-clipboard-manager = "2"
# Native desktop notifications (B50): shown from Rust when a problem appears,
# with the target carried as extra payload for click-to-navigate.
tauri-plugin-notification = "2"
# Automatic updates (B72): checks the update endpoint, verifies the manifest
# signature against the configured public key, and downloads/installs. The
# signing keypair is independent of Apple's Developer ID — CI signs with
# TAURI_SIGNING_PRIVATE_KEY, which may be absent until the updater goes live.
tauri-plugin-updater = "2"
# `relaunch()` for the frontend after an update is installed (B72).
tauri-plugin-process = "2"

# HTTP client for scraping node-exporter over a port-forward (B27) and for the
# opt-in crash-report POST (B73). Already in the tree via kube, so this adds no
# build time. `json` powers the report body; `rustls-no-provider` uses TLS
# without pinning a crypto provider — kube pins ring, and enabling reqwest's
# `rustls` (aws-lc-rs) instead would enable two providers and panic at runtime.
# (The node-exporter forward itself stays plaintext on localhost.)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

# --- Diagnostics (B73) ---
# File logging: non-blocking writer + daily rotation capped at N files, under
# the platform app log dir. `zip` builds the "Export diagnostics" bundle.
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# RFC 6902 JSON Patch for the metadata editor (B88); kube's `jsonpatch` feature
# enables the same crate, so this adds no new tree.
json-patch = "4"
# Parses the *public* x509 certificate of a kubernetes.io/tls Secret (B48). The
# private key is never touched.
x509-parser = "0.18"

# --- Async runtime & stream helpers ---
# "signal" powers the SIGTERM handler that saves window state (B22): dev/run.sh
# stops the app with SIGTERM, which Tauri does not hook.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"

# --- Kubernetes ---
# `kube` gives us the typed client, config parsing, and the watcher/reflector runtime.
kube = { version = "4.2", features = ["client", "config", "runtime", "ws", "jsonpatch"] }
# `k8s-openapi` provides the typed resource structs. The feature gate pins the API
# surface; `latest` tracks the newest Kubernetes release supported by the crate.
k8s-openapi = { version = "0.28", features = ["latest"] }

# --- Error handling & logging ---
thiserror = "2"
anyhow = "1"
# The redaction pass on exported diagnostics (B73): server URLs, bearer tokens,
# base64 blobs. Already in the tree via kube, so this adds no build time.
regex = "1"
tracing = "0.1"
# `std` exposes the `reload` module, which powers the Settings log-level change
# without a restart (B73).
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }

# --- Time formatting for log timestamps ---
chrono = { version = "0.4", features = ["serde"] }

# --- Raw HTTP requests to metrics.k8s.io (via kube::Client::request) ---
http = "1"
base64 = "0.22"
flate2 = "1"

# --- Local terminal pty (B82) ---
# Spawns the user's shell with a real pseudo-terminal (WezTerm's portable-pty —
# the same crate VS Code and Lens-style terminals use) so the kubectl terminal
# gets a proper TTY with resize support, on all three OSes.
portable-pty = "0.9"

[dev-dependencies]
# Generates test certificates for the TLS parsing tests (B48); never in prod.
rcgen = { version = "0.13", features = ["x509-parser"] }
# Exposes `tauri::test::mock_app()` for the ClientManager lifecycle tests (B76).
tauri = { version = "2", features = ["test"] }

[features]
# Reserved for future custom-protocol tweaks; kept so tauri.conf can reference it.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Smaller, faster desktop binary.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
